global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['host.docker.internal:3000']

  # notification.md — pg_stat_activity theo state (active/idle/...) +
  # max_connections, expose bởi container postgres-exporter (docker-compose.dev.yml).
  - job_name: 'postgres'
    static_configs:
      - targets: ['host.docker.internal:9187']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
