# Cấu hình Nginx Load Balancer cho Slack Clone Microservices
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/log/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Cấu hình log định dạng json hoặc chi tiết để dễ debug
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    # 1. Cụm Server API Gateway
    upstream api_gateway_backend {
        # Thuật toán cân bằng tải mặc định là Round-Robin
        # Sếp có thể liệt kê danh sách IP/Port của các instance api-gateway ở đây khi scale
        server api-gateway:3000 max_fails=3 fail_timeout=10s;
        
        # Ví dụ khi chạy nhiều máy chủ khác nhau:
        # server 192.168.1.10:3000 max_fails=3 fail_timeout=10s;
        # server 192.168.1.11:3000 max_fails=3 fail_timeout=10s;
    }

    # 2. Cụm Server Socket Gateway (Cần Sticky Sessions)
    upstream socket_gateway_backend {
        # Bắt buộc dùng ip_hash để đảm bảo tính năng Sticky Sessions (Session Affinity) cho Socket.io
        # Giúp giữ chân Client kết nối tới đúng 1 instance khi nâng cấp từ HTTP Handshake lên WebSocket
        ip_hash;

        server socket-gateway:3008 max_fails=3 fail_timeout=10s;
        
        # Ví dụ khi scale chạy nhiều instance socket-gateway:
        # server 192.168.1.10:3008 max_fails=3 fail_timeout=10s;
        # server 192.168.1.11:3008 max_fails=3 fail_timeout=10s;
    }

    # 3. Chuyển hướng tự động từ HTTP (Cổng 80) sang HTTPS (Cổng 443)
    server {
        listen 80;
        listen [::]:80;
        server_name api.tpt.io.vn; # Thay thế bằng domain API thực tế của sếp

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 4. Máy chủ chính chạy HTTPS (SSL/TLS Termination)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.tpt.io.vn;

        # Cấu hình SSL Certificate (Thay đường dẫn tới cert của sếp)
        ssl_certificate /etc/letsencrypt/live/api.tpt.io.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.tpt.io.vn/privkey.pem;

        # Cấu hình SSL bảo mật tối ưu
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        
        # SSL session settings
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Định tuyến luồng HTTP REST APIs (/api/*)
        location /api/ {
            proxy_pass http://api_gateway_backend;
            
            # Cấu hình chuyển tiếp Header gốc của Client
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tăng thời gian timeout cho các API xử lý lâu
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Định tuyến OAuth callback (GitHub/Google/Slack) vào mcp_auth — đây là
        # URL mà GitHub/Google redirect THẲNG browser của user tới sau khi họ
        # authorize, nên phải public, KHÔNG thể chỉ dùng app-net nội bộ.
        # mcp_auth cùng network app-net với slack-be nên resolve được qua tên
        # container "mcp_auth" (container_name trong mcp_auth/docker-compose.yml).
        location /oauth-callback/ {
            proxy_pass http://mcp_auth:3009/connect/callback/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Định tuyến luồng WebSockets Socket.io (/socket.io/*)
        location /socket.io/ {
            proxy_pass http://socket_gateway_backend;

            # Bắt buộc có để nâng cấp giao thức lên WebSocket thành công
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Chuyển tiếp các header nhận diện client
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tăng timeout giữ kết nối dài cho Socket (tránh bị ngắt đột ngột)
            proxy_connect_timeout 7d;
            proxy_read_timeout 7d;
            proxy_send_timeout 7d;

            # Tắt buffering cho WebSocket
            proxy_buffering off;
        }
    }
}
