services:
  livekit:
    image: livekit/livekit-server:v1.8.0
    container_name: slack-livekit-server
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"       # HTTP API và WebSocket Signaling
      - "7881:7881"       # WebRTC TCP (dự phòng khi UDP bị chặn)
      - "7882:7882/udp"   # WebRTC UDP (Single port mode qua UDP Mux)
    
    # Nạp file cấu hình môi trường chung từ thư mục gốc của slack-be
    env_file:
      - ../../.env
      
    # Sử dụng entrypoint để sinh động các biến môi trường cấu hình tại runtime
    # Tránh việc docker-compose cảnh báo thiếu biến trên máy Host và loại bỏ xung đột cổng Redis
    entrypoint:
      - /bin/sh
      - -c
      - |
        export LIVEKIT_KEYS="$${LIVEKIT_API_KEY}: $${LIVEKIT_API_SECRET}"
        export LIVEKIT_REDIS_ADDRESS="host.docker.internal:$${REDIS_PORT}"
        export LIVEKIT_REDIS_USERNAME="$${REDIS_USERNAME}"
        export LIVEKIT_REDIS_PASSWORD="$${REDIS_PASSWORD}"
        
        # Trích xuất IP/Host tự động
        LIVEKIT_HOST=$$(echo "$$LIVEKIT_URL" | sed -e 's/ws:\/\///' -e 's/:.*//')
        
        # NẾU LÀ LOCALHOST HOẶC RỖNG, DÙNG 127.0.0.1 ĐỂ BASS QUA LỖI UDP VM
        if [ "$$LIVEKIT_HOST" = "localhost" ] || [ -z "$$LIVEKIT_HOST" ]; then
          LIVEKIT_HOST="127.0.0.1"
        fi
        
        unset REDIS_HOST
        unset REDIS_PORT
        echo "--> LiveKit Server starting with Node IP: $$LIVEKIT_HOST"
        exec /livekit-server --config /etc/livekit.yaml --node-ip "$$LIVEKIT_HOST"

      
    restart: unless-stopped
    # Hỗ trợ container kết nối tới các service chạy ở host máy tính (ví dụ: Redis)
    extra_hosts:
      - "host.docker.internal:host-gateway"
