version: '3.8'

services:
  slack-be:
    image: ${DOCKER_USERNAME}/slack-be:latest
    container_name: slack-be
    restart: always
    ports:
      - "3000:3000"
      - "3008:3008"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
      redis-cache:
        condition: service_started
      redis-bullmq:
        condition: service_started
      loki:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    container_name: slack-postgres
    restart: always
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: slack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: slack-pgbouncer
    restart: always
    environment:
      DB_USER: dev
      DB_PASSWORD: 123456
      DB_HOST: postgres
      DB_PORT: 5432
      LISTEN_PORT: 6432
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
    ports:
      - "6432:6432"
    depends_on:
      - postgres

  redis-cache:
    image: redis:7-alpine
    container_name: slack-redis-cache
    restart: always
    command: redis-server --requirepass 123456
    ports:
      - "6379:6379"
    volumes:
      - redis_cache_data:/data

  redis-bullmq:
    image: redis:7-alpine
    container_name: slack-redis-bullmq
    restart: always
    command: redis-server --requirepass 123456
    ports:
      - "6380:6379"
    volumes:
      - redis_bullmq_data:/data

  loki:
    image: grafana/loki:latest
    container_name: slack-loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki

  grafana:
    image: grafana/grafana:latest
    container_name: slack-grafana
    restart: always
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_DOMAIN=api.tpt.io.vn
      - GF_SERVER_ROOT_URL=https://api.tpt.io.vn/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    depends_on:
      - loki
    volumes:
      - grafana_data:/var/lib/grafana

  prometheus:
    image: prom/prometheus:latest
    container_name: slack-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat << 'EOF' > /etc/prometheus/prometheus.yml
        global:
          scrape_interval: 15s
          evaluation_interval: 15s

        scrape_configs:
          - job_name: 'prometheus'
            static_configs:
              - targets: ['localhost:9090']

          - job_name: 'cadvisor'
            static_configs:
              - targets: ['cadvisor:8080']

          - job_name: 'api-gateway'
            static_configs:
              - targets: ['slack-be:3000']

          - job_name: 'node-exporter'
            static_configs:
              - targets: ['node-exporter:9100']
        EOF
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: slack-cadvisor
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  node-exporter:
    image: prom/node-exporter:latest
    container_name: slack-node-exporter
    restart: always
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

volumes:
  postgres_data:
  redis_cache_data:
  redis_bullmq_data:
  loki_data:
  grafana_data:
  prometheus_data:
